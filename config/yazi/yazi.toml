# Dev Cockpit yazi behavior.
#
# The opener table mirrors yazi's built-in defaults and adds `bat`, so text and
# code files can be viewed with syntax highlighting and paged output instead of
# `cat`. Qualified macOS installs route `edit` through the deployed dev-edit
# bridge; Linux and Windows keep their existing openers until the bridge is
# qualified there. The separate external opener always uses the user's existing
# editor preference; press `b` inside yazi to pick an external editor or the
# read-only bat viewer.

[opener]
edit = [
	{ run = "dev-edit -- %s", desc = "Dev Cockpit editor", for = "macos", block = true },
	{ run = "${EDITOR:-bat --paging=always} %s", desc = "$EDITOR", for = "unix", block = true },
	{ run = "code -w %s", desc = "code (block)", for = "windows", block = true },
]
external = [
	{ run = "${VISUAL:-${EDITOR:-vi}} %s", desc = "External editor", for = "unix", block = true },
	{ run = "code -w %s", desc = "External editor (code)", for = "windows", block = true },
]
bulk-rename = [
	{ run = "dev-edit --standalone --wait -- %s", desc = "Dev Cockpit editor (wait)", for = "macos", block = true },
	{ run = "${VISUAL:-${EDITOR:-vi}} %s", desc = "External editor (wait)", for = "unix", block = true },
	{ run = "code -w %s", desc = "External editor (wait)", for = "windows", block = true },
]
bat = [
	{ run = "bat --style=numbers,changes,header --paging=always %s", desc = "bat (paged)", for = "unix", block = true },
	{ run = "bat --style=numbers,changes,header --paging=always %s", desc = "bat (paged)", for = "windows", block = true },
]
play = [
	{ run = "xdg-open %s1", desc = "Play", for = "linux", orphan = true },
	{ run = "open %s", desc = "Play", for = "macos" },
	{ run = 'start "" %s1', desc = "Play", for = "windows", orphan = true },
	{ run = "termux-open %s1", desc = "Play", for = "android" },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
	{ run = "mediainfo %s1 & pause", block = true, desc = "Show media info", for = "windows" },
]
open = [
	{ run = "xdg-open %s1", desc = "Open", for = "linux" },
	{ run = "open %s", desc = "Open", for = "macos" },
	{ run = 'start "" %s1', desc = "Open", for = "windows", orphan = true },
	{ run = "termux-open %s1", desc = "Open", for = "android" },
]
reveal = [
	{ run = "xdg-open %d1", desc = "Reveal", for = "linux" },
	{ run = "open -R %s1", desc = "Reveal", for = "macos" },
	{ run = "explorer /select,%s1", desc = "Reveal", for = "windows", orphan = true },
	{ run = "termux-open %d1", desc = "Reveal", for = "android" },
	{ run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
]
extract = [
	{ run = "ya pub extract --list %s", desc = "Extract here" },
]
download = [
	{ run = "ya emit download --open %S", desc = "Download and open" },
	{ run = "ya emit download %S", desc = "Download" },
]
trash = [
	{ run = "ya pub trash-restore --list %S", desc = "Restore selected files" },
	{ run = "ya pub trash-empty --list %S", desc = "Empty trash bin" },
]

[open]
rules = [
	# Bulk rename must wait until the temporary file has finished editing.
	{ url = "bulk-rename.txt", mime = "text/plain", use = "bulk-rename" },
	# Folder
	{ mime = "folder/*", use = [ "edit", "external", "open", "reveal" ] },
	# Text and code: edit first, bat second, then reveal in the OS file manager.
	{ mime = "text/*", use = [ "edit", "external", "bat", "reveal" ] },
	# Image
	{ mime = "image/*", use = [ "open", "reveal" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Code
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "external", "bat", "reveal" ] },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# Empty file
	{ mime = "inode/empty", use = [ "edit", "external", "reveal" ] },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", use = "download" },
	# Trash
	{ mime = "trash/**", use = [ "open", "trash" ] },
	# Fallback
	{ url = "*", use = [ "open", "reveal" ] },
]
