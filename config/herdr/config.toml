# Dev Cockpit Herdr styling. Catppuccin Mocha tokens on top of the built-in
# catppuccin theme, with a wider sidebar, pane gaps and a richer status bar.
# Herdr may rewrite this file when you change settings from its UI; Dev Cockpit
# then treats it as user-edited and leaves it alone.
onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
sidebar_bg = "#181825"
active_row_bg = "#313244"
selection_bg = "#45475a"
panel_bg = "#1e1e2e"
accent = "#cba6f7"
red = "#f38ba8"
green = "#a6e3a1"

[ui]
status_indicators = "symbols"
sidebar_width = 30
sidebar_min_width = 22
sidebar_max_width = 42
pane_borders = "auto"
pane_outer_borders = true
pane_scrollbars = true
pane_gaps = true
tab_bar_position = "top"
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }, { type = "datetime" }]
tab_bar_right_separator = "  "
hide_tab_bar_when_single_tab = false
confirm_close = true
prompt_new_tab_name = true
copy_on_select = true
mouse_capture = true
redraw_on_focus_gained = true

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"
