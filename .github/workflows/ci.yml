name: Bootstrap checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and isolated configuration integration tests
        run: python -m unittest discover -s tests -v
      - name: Default setup end-to-end configuration (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target="$RUNNER_TEMP/dev-cockpit-e2e"
          python bootstrap/cockpit.py --apply-config --home "$target"
          # Editor assets are gated by qualified platform capability. macOS gets
          # the Fresh preferences, the backend selection and the executable
          # dev-edit bridge; Linux gets the bridge only (its editor integration
          # is experimental); neither platform may receive the other's defaults.
          test -x "$target/.local/bin/dev-edit"
          grep -q 'edit "$@"' "$target/.local/bin/dev-edit"
          if [ "$RUNNER_OS" = 'macOS' ]; then
            test -f "$target/.hammerspoon/init.lua"
            test -f "$target/.config/fresh/config.json"
            test -f "$target/.config/dev-cockpit/editor.json"
          else
            test ! -e "$target/.hammerspoon/init.lua"
            test ! -e "$target/.config/fresh/config.json"
            test ! -e "$target/.config/dev-cockpit/editor.json"
          fi
          # A second apply must create nothing new: the bridge and the
          # create-only editor preferences are stable and idempotent.
          python bootstrap/cockpit.py --apply-config --home "$target" > "$target/second.log"
          if grep -q 'APPLY create' "$target/second.log"; then
            cat "$target/second.log"
            echo 'Second apply created files instead of reusing the managed ones.' >&2
            exit 1
          fi
      - name: Default setup end-to-end configuration (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'dev-cockpit-e2e'
          python bootstrap/cockpit.py --apply-config --home $target
          if (Test-Path (Join-Path $target '.hammerspoon/init.lua')) { throw 'Windows must not install the macOS gesture bridge.' }
          # The Windows editor bridge is not qualified yet, so native Windows must
          # receive no editor defaults at all rather than a broken opener.
          if (Test-Path (Join-Path $target '.local/bin/dev-edit')) { throw 'Windows must not receive the POSIX dev-edit bridge.' }
          if (Test-Path (Join-Path $target '.config/fresh/config.json')) { throw 'Windows must not receive unqualified Fresh preferences.' }
          if (Test-Path (Join-Path $target '.config/dev-cockpit/editor.json')) { throw 'Windows must not receive the macOS-only editor backend selection.' }
      - name: Unix entrypoint and shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n bootstrap/setup.sh
          bash -n config/shell/init.sh
          sh bootstrap/setup.sh --dry-run
      - name: Windows PowerShell 5.1 entrypoint
        if: runner.os == 'Windows'
        shell: powershell
        run: '& .\bootstrap\setup.ps1 -DryRun'
      - name: PowerShell 7 entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\bootstrap\setup.ps1 -DryRun'
      - name: Published Unix one-liner (install smoke test)
        if: github.event_name == 'push' && runner.os != 'Windows'
        shell: bash
        env:
          DEV_COCKPIT_REF: ${{ github.sha }}
        run: curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/UtkarshBhardwaj007/dev-cockpit/main/bootstrap/setup.sh | sh
      - name: Published Windows one-liner (install smoke test)
        if: github.event_name == 'push' && runner.os == 'Windows'
        shell: powershell
        env:
          DEV_COCKPIT_REF: ${{ github.sha }}
        run: '& ([scriptblock]::Create((Invoke-RestMethod https://raw.githubusercontent.com/UtkarshBhardwaj007/dev-cockpit/main/bootstrap/setup.ps1)))'
